name: CI


on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]


jobs:
  devtest:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rake ci
        env:
          PLATFORM_API_INTERNAL_KEY: ${{ env.PLATFORM_API_INTERNAL_KEY }}
          PLATFORM_PUBLIC_API: ${{ env.PLATFORM_PUBLIC_API }}
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5
        if: success() || failure()
        with:
          report_paths: 'results/junit/TEST-*.xml'
