name: CI


on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]


jobs:
  dev:
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: |
          echo "Testing against: $TARGET"
        env:
          TARGET: ${{ vars.PLATFORM_PUBLIC_API }}
      - run: bundle exec rake current
        env:
          PLATFORM_PUBLIC_API: ${{ vars.PLATFORM_PUBLIC_API }}
          PLATFORM_API_INTERNAL_KEY: ${{ secrets.PLATFORM_API_INTERNAL_KEY }}
          PLATFORM_API_KEY: ${{ secrets.PLATFORM_API_KEY }}
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5
        if: success() || failure()
        with:
          report_paths: 'results/junit/TEST-*.xml'
